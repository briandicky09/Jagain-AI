services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: jagain-ai-service
    ports:
      - "${AI_BIND_HOST:-127.0.0.1}:8001:8001"
    env_file:
      - path: ./ai-service/.env
        required: false
    environment:
      AI_ENV: ${AI_ENV:-production}
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:?AI_SERVICE_SECRET must be set (min 32 chars)}
      AI_EMBEDDING_BACKEND: ${AI_EMBEDDING_BACKEND:-sentence_transformer}
      AI_VISION_BACKEND: ${AI_VISION_BACKEND:-clip}
      AI_PRELOAD_MODELS: ${AI_PRELOAD_MODELS:-true}
      HF_HOME: /app/.cache/huggingface
    volumes:
      - ai_hf_cache:/app/.cache/huggingface
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    cpus: "2.0"
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped

volumes:
  ai_hf_cache:
