[project]
name = "jagain-ai-service"
version = "1.0.0"
description = "Independent FastAPI AI microservice for JAGAIN wildfire reporting, triage, semantic/geospatial deduplication, PII redaction, and evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pillow>=10.4.0,<12.0.0",
    "numpy>=1.26.0,<3.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "torch>=2.3.0,<3.0.0",
    "transformers>=4.45.0,<5.0.0",
    "sentence-transformers>=3.1.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.7.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "real_model: tests that download and run real pretrained Hugging Face / SentenceTransformer models",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008"]
